# PostgreSQL pour le développement local de Loktoré.
# En production, la base sera hébergée sur un serveur au Burkina Faso (cf. plan §8).
services:
  db:
    image: postgres:16-alpine
    container_name: loktore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loktore
      POSTGRES_PASSWORD: loktore
      POSTGRES_DB: loktore
    ports:
      - '5432:5432'
    volumes:
      - loktore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loktore']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loktore_pgdata:
